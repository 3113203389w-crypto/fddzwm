<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="中国卖家 Amazon FBA / FBM 头程物流费用测算与多方案对比 Agent" />
  <title>跨境头程费用 Agent</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark">航</div>
        <div><strong>头程智算</strong><span>FREIGHT AGENT</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="status-dot"><i></i><span>规则引擎已就绪</span></div>
        <button class="ghost mini" id="resetDemo">恢复演示数据</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow">AMAZON CROSS-BORDER LOGISTICS</p>
          <h1 id="pageTitle">智能测算</h1>
        </div>
        <div class="top-actions">
          <button class="fx-pill" id="fxStatus" data-action="refresh-fx" title="刷新参考汇率">汇率待刷新</button>
          <span class="market-pill" id="marketPill">🇺🇸 美国站 · FBA</span>
          <button class="ghost" id="exportBtn">导出方案</button>
          <button class="primary" data-action="open-quote">＋ 添加报价</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="shipmentDialog" class="modal"></dialog>
  <dialog id="quoteDialog" class="modal wide"></dialog>
  <dialog id="splitQuoteDialog" class="modal wide"></dialog>
  <input id="importInput" type="file" accept="application/json" hidden />
  <script src="./app.js"></script>
</body>
</html>
